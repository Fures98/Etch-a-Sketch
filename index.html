<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="style.css">
	<script src="script.js" defer></script>
</head>
<body>
	<div class="container">
		<h1>Sketch an Etch</h1>
		<div>
			<div class="sketch"></div>
			<div class="options">
				<label><i>Hint:</i> Hold D to draw</label>
				<div><label for="resolution">Resolution</label><input type="range" id="resolution"></div>
				<button id="remove">Clear</button>
				<div><label for="color">Color</label><input type="color" id="color"></div>
				<div><label for="rainbow">Rainbow Mode</label><input type="checkbox" id="rainbow"></div>
			</div>
		</div>
	</div>
	<div class="copyright">Copyright obviously belongs to <a href="https://www.github.com/fures98/">Hesham Furqani</a></div>
</body>
</html>
